<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnaliseHinosApp — Protótipo da Tela de Lançamento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 6px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
    }
    .preview-container {
      background: #020617;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 2px #334155;
      max-width: 420px;
      width: 100%;
    }
    .preview-container img {
      width: 100%;
      height: auto;
      border-radius: 30px;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>📱 AnaliseHinosApp — Nível 1: Protótipo Visual</h1>
    <p>Tela de Lançamento Rápido de Hinos com Teclado Numérico Customizado</p>
  </header>
  <main class="preview-container">
    <img src="/prototipo-lancamento.jpg" alt="Protótipo da Tela de Lançamento" />
  </main>
</body>
</html>
